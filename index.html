<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 戏精导演 · Demo V0.4</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif }
    * { box-sizing:border-box }
    body { margin:0; background:#0e0e18; color:#f5f2ff }
    .app { max-width:600px; margin:auto; padding:16px 16px 28px }
    .head { display:flex; justify-content:space-between; align-items:center }
    .head h1 { font-size:23px; margin:10px 0 }
    .chip { font-size:12px; color:#d9baff; background:#312342; padding:7px 10px; border-radius:30px }
    .stage { position:relative; overflow:hidden; border-radius:20px; background:#1c1c2d; aspect-ratio:3/4; max-height:65vh; display:flex; align-items:center; justify-content:center }
    .stage video,.stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1) }
    .stage video { z-index:1 }
    .stage canvas { z-index:2; pointer-events:none }
    .placeholder { color:#a4a0b5; text-align:center; padding:25px }
    .placeholder strong { display:block; font-size:50px }
    .overlay { position:absolute; inset:0; z-index:3; pointer-events:none; transition:background .25s }
    .subtitle { position:absolute; z-index:5; bottom:38px; left:12px; right:12px; text-align:center; font-weight:800; font-size:clamp(17px,5vw,25px); text-shadow:0 3px 8px black,0 0 18px black; opacity:0; transform:translateY(10px); transition:.2s; pointer-events:none }
    .subtitle.visible { opacity:1; transform:translateY(0) }
    .tag { position:absolute; z-index:4; top:12px; left:12px; background:#0009; padding:7px 10px; border-radius:10px; font-size:12px }
    .status { margin:12px 0; color:#d2cbe6; font-size:13px; min-height:22px; line-height:1.6 }
    .status.error { color:#ffb8b8 }
    .status.ok { color:#acf0cd }
    .controls,.history,.diagnostic { background:#1c1a2a; padding:15px; border-radius:16px }
    .slider-labels { display:flex; justify-content:space-between; color:#b6aecb; font-size:12px }
    .controls input { width:100%; accent-color:#b58cff; margin:14px 0 }
    .buttons { display:flex; flex-wrap:wrap; gap:9px; margin-top:12px }
    button { border:0; border-radius:12px; padding:13px 12px; font-weight:700; font-size:14px; cursor:pointer }
    button:disabled { opacity:.45; cursor:default }
    #start { background:#a879ff; color:#140925; flex:1 0 48% }
    #cameraTest { background:#4b3e60; color:white; flex:1 0 35% }
    #stop { background:#363044; color:white; flex:1 0 100% }
    .history { margin-top:14px }
    .history h2 { font-size:15px; margin:0 0 10px }
    .history ol { padding-left:22px; margin:0; color:#d1cadf; font-size:13px; max-height:180px; overflow:auto }
    .history li { margin:8px 0 }
    .diagnostic { margin-top:14px; font-size:12px; line-height:1.7; color:#c7c1d8 }
    .diagnostic summary { font-weight:700; cursor:pointer; font-size:14px }
    .diagnostic p { margin:8px 0 0; overflow-wrap:anywhere; white-space:pre-line }
    #copyLog { background:#514569; color:white; margin-top:10px; padding:10px 12px; width:100% }
    .diagnostic pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.55 ui-monospace,Consolas,monospace; max-height:180px; overflow:auto; margin:8px 0 0 }
    .hint { font-size:12px; color:#aaa4bd; line-height:1.7; margin-top:12px }
    .shake { animation:shake .4s ease-in-out }
    @keyframes shake { 0%,100%{translate:0 0}20%{translate:-7px 2px}40%{translate:6px -3px}60%{translate:-4px 4px}80%{translate:4px -1px} }
    .flash { background:radial-gradient(ellipse,#d6b1ff50,transparent 70%) }
    .gray { background:#14141455; backdrop-filter:grayscale(.85) }
    .warm { background:#ff8a2040 }
  </style>
</head>
<body>
<main class="app">
  <header class="head"><h1>🎬 AI 戏精导演</h1><span class="chip">Demo V0.4</span></header>
  <section class="stage" id="stage">
    <div class="placeholder" id="placeholder"><strong>🎭</strong>先测试摄像头<br>再让 AI 为你的动作加戏</div>
    <video id="video" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay"></div>
    <div class="tag" id="tag">等待摄像头</div>
    <div class="subtitle" id="subtitle"></div>
  </section>
  <p class="status" id="status" aria-live="polite">准备就绪 · 可以先点击“测试摄像头”</p>
  <section class="controls">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>戏精强度</b><span id="levelName">夸张</span></div>
    <input id="level" type="range" min="0" max="2" value="1" step="1" aria-label="戏精强度">
    <div class="slider-labels"><span>普通</span><span>夸张</span><span>离谱</span></div>
    <div class="buttons">
      <button id="cameraTest" type="button">📷 测试摄像头</button>
      <button id="start" type="button">🎬 开始表演</button>
      <button id="stop" type="button" disabled>结束 / 关闭摄像头</button>
    </div>
  </section>
  <section class="history"><h2>📜 本次互动记录</h2><ol id="history"><li>尚无动作记录</li></ol></section>
  <details class="diagnostic" id="diagnostic">
    <summary>🔧 启动诊断信息（出问题时展开）</summary>
    <p id="env"></p><pre id="logs" aria-live="polite"></pre><button type="button" id="copyLog">📋 复制诊断日志</button>
  </details>
  <p class="hint">先连接摄像头，再从 MediaPipe 模型库加载动作识别。首次加载需联网；若失败，展开“启动诊断信息”并复制日志。请在手机 Chrome / Safari / Edge 中打开 HTTPS 网页。</p>
</main>
<script>
'use strict';
// 关键修复：这是一段普通脚本，没有顶层 import。无论 CDN 是否可用，摄像头按钮都能注册。
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d'), stage = $('stage');
const texts = {
  forehead:['今天真的有点头疼。','这一刻，他终于理解了命运的重量！','天塌了！整个宇宙都在为他的崩溃而颤抖！'],
  head:['他抱住了头。','突如其来的真相，让他陷入了绝望！','警报！主角精神值归零，世界即将重启！'],
  turn:['他转过了头。','命运的镜头，在这一刻突然转向！','仅仅一个回眸，时间线竟发生了不可逆的崩塌！']
};
const names = {forehead:'扶额',head:'双手抱头',turn:'转头'};
const levels = ['普通','夸张','离谱'];
let stream = null, pose = null, face = null, running = false, loading = false;
let raf = 0, lastVideoTime = -1, lastInferenceTime = 0, stable = '', stableFrames = 0;
let armed = true, lastFire = 0, clearTimer = 0, events = 0, session = 0;
const lines = [];
function log(s) {
  lines.push(new Date().toLocaleTimeString() + ' ' + s);
  if (lines.length > 45) lines.shift();
  $('logs').textContent = lines.join('\n');
}
function status(s, cls='') { $('status').textContent = s; $('status').className = 'status ' + cls; log(s); }
function errorText(e) {
  const n = e && e.name || 'Error', msg = e && e.message || String(e);
  const tips = {
    NotAllowedError:'浏览器拒绝了摄像头权限。检查地址栏的网站权限，以及手机系统对浏览器的摄像头授权。',
    PermissionDeniedError:'摄像头被拒绝授权，请在浏览器设置中重新允许。',
    NotFoundError:'未检测到可用摄像头。',
    DevicesNotFoundError:'未检测到可用摄像头。',
    NotReadableError:'摄像头可能被其他 App 占用，或系统禁止使用。',
    AbortError:'摄像头启动被系统中断，关闭其他使用摄像头的程序后重试。',
    OverconstrainedError:'摄像头不支持所要求的参数。',
    SecurityError:'浏览器或当前页面禁止访问摄像头。'
  };
  return n + ': ' + msg + (tips[n] ? '；' + tips[n] : '');
}
function updateEnvironment() {
  let embedded = false;
  try { embedded = window.top !== window.self } catch(e) { embedded = true }
  $('env').textContent = '地址：' + location.href + '\nHTTPS/安全上下文：' + (window.isSecureContext ? '是' : '否') +
    '\n摄像头 API：' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? '支持' : '不可用') +
    '\n嵌入式页面：' + (embedded ? '是（可能受权限限制）' : '否') +
    '\n浏览器：' + navigator.userAgent;
  if (!window.isSecureContext) status('⚠️ 当前不是安全网页。请打开以 https:// 开头的 GitHub Pages 网站。', 'error');
  else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) status('⚠️ 当前浏览器不支持摄像头 API，请换用手机 Chrome / Safari / Edge。', 'error');
  else log('页面脚本已正常运行；摄像头 API 可用。');
}
function setButtons() {
  const busy = loading;
  $('cameraTest').disabled = busy || !!stream;
  $('start').disabled = busy || running;
  $('stop').disabled = !stream;
  $('start').textContent = running ? '✅ 正在表演' : stream ? '🎬 启动 / 重试 AI' : '🎬 开始表演';
}
function closeCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.pause(); video.srcObject = null;
}
async function openCamera() {
  if (stream && stream.active) return;
  if (!window.isSecureContext) throw new Error('当前网页不是安全上下文（请用 https:// 域名访问 GitHub Pages）。');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('navigator.mediaDevices.getUserMedia 不可用。请检查 HTTPS、浏览器及网页容器。');
  status('正在申请摄像头权限…');
  // getUserMedia 直接由点击事件调用，不会先等待 AI 或 CDN 下载。
  let s;
  try {
    s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    stream = s; video.srcObject = s;
    await video.play();
    $('placeholder').style.display = 'none';
    $('tag').textContent = '📷 摄像头已连接';
    status('✅ 摄像头打开成功！现在可以启动 AI 动作识别。', 'ok');
  } catch(e) {
    if (s) s.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null;
    throw e;
  } finally { setButtons(); }
}
$('cameraTest').addEventListener('click', async () => {
  try { await openCamera(); }
  catch(e) { status('摄像头失败：' + errorText(e), 'error'); $('diagnostic').open = true; setButtons(); }
});
function dist(a,b) { return Math.hypot(a.x-b.x,a.y-b.y); }
function detect(p,f) {
  if (p && [0,11,12,15,16].every(i=>p[i] && (p[i].visibility ?? 1) > .48)) {
    const nose=p[0],ls=p[11],rs=p[12],lw=p[15],rw=p[16], shoulder=dist(ls,rs);
    if (shoulder > .09) {
      const near=w=>dist(w,nose)<shoulder*.66;
      const raised=w=>w.y<Math.max(ls.y,rs.y)+shoulder*.2;
      if (near(lw)&&near(rw)&&raised(lw)&&raised(rw)) return 'head';
      if ((near(lw)&&raised(lw)) || (near(rw)&&raised(rw))) return 'forehead';
    }
  }
  if (f && f.length) {
    const fl=f[0],left=fl[33],right=fl[263],tip=fl[1];
    if (left&&right&&tip) {
      const width=Math.abs(right.x-left.x);
      if (width>.045 && Math.abs(tip.x-(left.x+right.x)/2)/width>.25) return 'turn';
    }
  }
  return null;
}
function sound() {
  try {
    const Audio=window.AudioContext||window.webkitAudioContext;
    if (!Audio) return;
    const a=new Audio(),now=a.currentTime;
    [220,165,110].forEach((freq,i)=>{
      const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=freq;
      g.gain.setValueAtTime(.0001,now+i*.14);
      g.gain.exponentialRampToValueAtTime(.12,now+i*.14+.02);
      g.gain.exponentialRampToValueAtTime(.0001,now+i*.14+.42);
      o.connect(g);g.connect(a.destination);o.start(now+i*.14);o.stop(now+i*.14+.43);
    });
    setTimeout(()=>a.close(),1300);
  } catch(e) { log('音效被浏览器拦截：'+errorText(e)); }
}
function fire(action) {
  lastFire=performance.now(); events++;
  const line=texts[action][+$('level').value];
  $('subtitle').textContent=line; $('subtitle').classList.add('visible');
  $('tag').textContent='🎭 已识别：'+names[action];
  $('overlay').className='overlay '+(action==='forehead'?'gray':action==='head'?'flash':'warm');
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  sound(); if (navigator.vibrate) navigator.vibrate(100);
  const li=document.createElement('li');
  li.textContent=`${new Date().toLocaleTimeString()} · ${names[action]} · ${levels[+$('level').value]}：${line}`;
  if (events===1) $('history').innerHTML=''; $('history').prepend(li);
  status('🎭 识别成功：'+names[action], 'ok');
  clearTimeout(clearTimer);
  clearTimer=setTimeout(()=>{$('subtitle').classList.remove('visible');$('overlay').className='overlay';stage.classList.remove('shake');},2600);
}
async function makeDetector(Cl,vision,modelPath,config,label) {
  let lastError;
  for (const delegate of ['GPU','CPU']) {
    try {
      status('正在初始化'+label+'（'+delegate+'）…');
      const detector = await Cl.createFromOptions(vision, {
        baseOptions:{modelAssetPath:modelPath,delegate}, runningMode:'VIDEO', ...config
      });
      log('✅ '+label+' '+delegate+' 初始化成功');
      return detector;
    } catch(e) {
      lastError=e;
      log('❌ '+label+' '+delegate+' 失败：'+errorText(e));
    }
  }
  log(label+'未能启动：'+errorText(lastError));
  return null;
}
async function loadAI() {
  // 保持固定版本，防止 CDN 升级时 WebAssembly 和 JavaScript 版本不一致。
  // 优先用官方文档中的 vision_bundle.mjs，失败后尝试备用 CDN。
  const sources = [
    {label:'jsDelivr 标准版',
      js:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs',
      wasm:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'},
    {label:'unpkg 备用版',
      js:'https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs',
      wasm:'https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm'},
    {label:'jsDelivr ESM 备用版',
      js:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm',
      wasm:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'}
  ];
  const base='https://storage.googleapis.com/mediapipe-models/';
  let failures=[];
  for (const source of sources) {
    try {
      status('正在连接 '+source.label+'（下载 AI 运行库）…');
      log('加载库地址：'+source.js);
      const mod = await import(source.js);
      const lib = mod.PoseLandmarker ? mod : (mod.default || mod);
      const {PoseLandmarker,FaceLandmarker,FilesetResolver} = lib;
      if (!PoseLandmarker || !FaceLandmarker || !FilesetResolver) {
        throw new Error('MediaPipe 库已下载，但未找到识别组件的导出。');
      }
      log('✅ '+source.label+' 库导入成功');
      status('正在准备 WASM 运行环境：'+source.label+'…');
      const vision=await FilesetResolver.forVisionTasks(source.wasm);
      log('WASM 文件目录：'+source.wasm);
      if (!pose) pose=await makeDetector(PoseLandmarker,vision,
        base+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        {numPoses:1,minPoseDetectionConfidence:.6,minPosePresenceConfidence:.6,minTrackingConfidence:.6},'姿态模型');
      if (!face) face=await makeDetector(FaceLandmarker,vision,
        base+'face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        {numFaces:1,minFaceDetectionConfidence:.6,minFacePresenceConfidence:.6,minTrackingConfidence:.6},'面部模型');
      if (pose || face) {
        if (!pose) log('⚠️ 姿态模型不可用：仅支持转头。');
        if (!face) log('⚠️ 面部模型不可用：仅支持扶额和抱头。');
        log('✅ AI 至少有一项模型已就绪（'+source.label+'）');
        return;
      }
      throw new Error('两项模型均初始化失败，请核对前面的具体错误（可能无法访问 Google 模型存储地址）。');
    } catch(e) {
      failures.push(source.label+': '+errorText(e));
      log('❌ '+source.label+' 失败：'+errorText(e));
    }
  }
  throw new Error('AI 资源加载失败，已尝试全部备用地址。详情：'+failures.join(' | '));
}
$('copyLog').addEventListener('click', async () => {
  const info=$('env').textContent+'\n\n'+$('logs').textContent;
  try {
    await navigator.clipboard.writeText(info);
    $('copyLog').textContent='✅ 已复制，可粘贴给 ChatGPT';
  } catch (e) {
    const selection=window.getSelection(), range=document.createRange();
    $('diagnostic').open=true;
    range.selectNodeContents($('logs')); selection.removeAllRanges(); selection.addRange(range);
    $('copyLog').textContent='请长按已选中的日志复制';
  }
});
function loop() {
  if (!running) return;
  try {
    if (video.readyState>=2 && video.videoWidth>0 && video.currentTime!==lastVideoTime) {
      const t=performance.now();
      // 限制推理频率，减少中低端手机发热和卡顿。
      if (t-lastInferenceTime>=90) {
        lastInferenceTime=t; lastVideoTime=video.currentTime;
        const w=video.videoWidth,h=video.videoHeight;
        if (canvas.width!==w) canvas.width=w;
        if (canvas.height!==h) canvas.height=h;
        const pr=pose?.detectForVideo(video,t),fr=face?.detectForVideo(video,t);
        ctx.clearRect(0,0,w,h);
        const p=pr?.landmarks?.[0];
        if (p) {
          ctx.fillStyle='#c6a4ff';
          for(const point of p) if ((point.visibility??1)>.55) {
            ctx.beginPath();ctx.arc(point.x*w,point.y*h,3,0,Math.PI*2);ctx.fill();
          }
        }
        const action=detect(p,fr?.faceLandmarks);
        if (action===stable) stableFrames++; else { stable=action; stableFrames=1; }
        if (!action) { if (stableFrames>=3) armed=true; }
        else if (stableFrames>=3 && armed && t-lastFire>1600) { fire(action); armed=false; }
        if (!action && t-lastFire>2800) $('tag').textContent='🟢 正在识别';
      }
    }
  } catch(e) {
    running=false;
    status('AI 识别异常：'+errorText(e)+'。摄像头仍保持打开。','error');
    $('diagnostic').open=true; setButtons(); return;
  }
  raf=requestAnimationFrame(loop);
}
$('start').addEventListener('click', async () => {
  if (loading || running) return;
  loading=true; setButtons();
  const mySession=session;
  try {
    await openCamera();
    if (mySession!==session) return;
    if (!pose && !face) await loadAI();
    if (mySession!==session || !stream) return;
    running=true;lastVideoTime=-1;lastInferenceTime=0;stable='';stableFrames=0;armed=true;
    $('tag').textContent='🟢 正在识别';
    status('AI 已启动 · 面向镜头，尝试扶额、抱头或转头。','ok');
    loop();
  } catch(e) {
    status((stream?'AI 加载失败（摄像头仍正常）：':'启动失败：')+errorText(e),'error');
    $('diagnostic').open=true;
  } finally { loading=false; setButtons(); }
});
function stop() {
  session++;running=false;cancelAnimationFrame(raf);clearTimeout(clearTimer);
  closeCamera();ctx.clearRect(0,0,canvas.width,canvas.height);
  $('placeholder').style.display='block';$('tag').textContent='等待摄像头';
  $('subtitle').classList.remove('visible');$('overlay').className='overlay';
  loading=false;setButtons();status('已结束 · 摄像头已关闭');
}
$('stop').addEventListener('click', stop);
$('level').addEventListener('input',()=>{$('levelName').textContent=levels[+$('level').value];});
window.addEventListener('pagehide',()=>{running=false;cancelAnimationFrame(raf);closeCamera();});
window.addEventListener('unhandledrejection',e=>{log('未处理异步错误：'+errorText(e.reason));$('diagnostic').open=true;});
window.addEventListener('error',e=>{log('脚本错误：'+e.message);$('diagnostic').open=true;});
updateEnvironment();setButtons();
</script>
</body>
</html>
