<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 戏精导演 · Demo V0.1</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0e0e18;color:#f5f2ff}.app{max-width:600px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:23px;margin:10px 0}.chip{font-size:12px;color:#d9baff;background:#312342;padding:7px 10px;border-radius:30px}.stage{position:relative;overflow:hidden;border-radius:20px;background:#1c1c2d;aspect-ratio:3/4;max-height:65vh;display:flex;align-items:center;justify-content:center}.stage video,.stage canvas{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.stage canvas{pointer-events:none}.placeholder{color:#a4a0b5;text-align:center;padding:25px}.placeholder strong{display:block;font-size:50px}.overlay{position:absolute;inset:0;pointer-events:none;transition:background .25s}.subtitle{position:absolute;bottom:38px;left:12px;right:12px;text-align:center;font-weight:800;font-size:clamp(17px,5vw,25px);text-shadow:0 3px 8px black,0 0 18px black;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.subtitle.visible{opacity:1;transform:translateY(0)}.tag{position:absolute;top:12px;left:12px;background:#0009;padding:7px 10px;border-radius:10px;font-size:12px}.status{margin:12px 0;color:#c7c1d8;font-size:13px;min-height:20px}.controls{background:#1c1a2a;padding:15px;border-radius:16px}.slider-labels{display:flex;justify-content:space-between;color:#b6aecb;font-size:12px}.controls input{width:100%;accent-color:#b58cff;margin:14px 0}.buttons{display:flex;gap:10px;margin-top:12px}button{border:0;border-radius:12px;padding:13px 14px;font-weight:700;font-size:14px;cursor:pointer}#start{background:#a879ff;color:#140925;flex:1}#stop{background:#363044;color:white}#stop:disabled{opacity:.45}.history{margin-top:16px;background:#1c1a2a;border-radius:16px;padding:14px}.history h2{font-size:15px;margin:0 0 10px}.history ol{padding-left:22px;margin:0;color:#d1cadf;font-size:13px;max-height:180px;overflow:auto}.history li{margin:8px 0}.hint{font-size:12px;color:#aaa4bd;line-height:1.6;margin-top:12px}.shake{animation:shake .4s ease-in-out}@keyframes shake{0%,100%{translate:0 0}20%{translate:-7px 2px}40%{translate:6px -3px}60%{translate:-4px 4px}80%{translate:4px -1px}}.flash{background:radial-gradient(ellipse,#d6b1ff50,transparent 70%)}.gray{background:#14141455;backdrop-filter:grayscale(.85)}.warm{background:#ff8a2040}
</style>
</head>
<body><main class="app"><header class="head"><h1>🎬 AI 戏精导演</h1><span class="chip">Demo V0.1</span></header>
<section class="stage" id="stage"><div class="placeholder" id="placeholder"><strong>🎭</strong>点击下方按钮<br>让 AI 为你的动作加戏</div><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><div class="overlay" id="overlay"></div><div class="tag" id="tag">等待摄像头</div><div class="subtitle" id="subtitle"></div></section>
<p class="status" id="status" aria-live="polite">准备就绪 · 支持转头、扶额、双手抱头</p>
<section class="controls"><div style="display:flex;justify-content:space-between;align-items:center"><b>戏精强度</b><span id="levelName">夸张</span></div><input id="level" type="range" min="0" max="2" value="1" step="1" aria-label="戏精强度"><div class="slider-labels"><span>普通</span><span>夸张</span><span>离谱</span></div><div class="buttons"><button id="start">📷 开始表演</button><button id="stop" disabled>结束</button></div></section>
<section class="history"><h2>📜 本次互动记录</h2><ol id="history"><li>尚无动作记录</li></ol></section><p class="hint">识别基于设备本地运行的 MediaPipe 姿态关键点模型。首次加载需联网，摄像头需 HTTPS 或 localhost。光线不足或动作不明确时保持静默。</p></main>
<script type="module">
import {PoseLandmarker,FaceLandmarker,FilesetResolver,DrawingUtils} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage');
const texts={forehead:['今天真的有点头疼。','这一刻，他终于理解了命运的重量！','天塌了！整个宇宙都在为他的崩溃而颤抖！'],head:['他抱住了头。','突如其来的真相，让他陷入了绝望！','警报！主角精神值归零，世界即将重启！'],turn:['他转过了头。','命运的镜头，在这一刻突然转向！','仅仅一个回眸，时间线竟发生了不可逆的崩塌！']};
const names={forehead:'扶额',head:'双手抱头',turn:'转头'},levels=['普通','夸张','离谱'];
let pose,face,stream,running=false,lastVideoTime=-1,stable='',stableFrames=0,armed=true,lastAction='',lastFire=0,clearTimer,raf,events=0,previousNose=null;
$('level').oninput=()=>{$('levelName').textContent=levels[+$('level').value]};
function status(s){$('status').textContent=s}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function detect(p,f){if(!p)return null;const valid=[0,7,8,11,12,15,16].every(i=>p[i]&&p[i].visibility>.55);if(!valid)return null;
const nose=p[0],le=p[7],re=p[8],ls=p[11],rs=p[12],lw=p[15],rw=p[16];const shoulder=dist(ls,rs);if(shoulder<.09)return null;
const near=(w)=>dist(w,nose)<shoulder*.65;const raised=(w)=>w.y<Math.max(ls.y,rs.y)+shoulder*.2;
if(near(lw)&&near(rw)&&raised(lw)&&raised(rw))return 'head';
if((near(lw)&&raised(lw))||(near(rw)&&raised(rw)))return 'forehead';
// Face yaw from face landmarks: nose relative to eye centers; require a face detection.
if(f&&f.length){const fl=f[0];const left=fl[33],right=fl[263],tip=fl[1];if(left&&right&&tip){const width=Math.abs(right.x-left.x);if(width>.045){const mid=(left.x+right.x)/2;const yaw=Math.abs(tip.x-mid)/width;if(yaw>.25)return 'turn';}}}
return null}
function sound(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),now=a.currentTime;[220,165,110].forEach((freq,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now+i*.14);g.gain.exponentialRampToValueAtTime(.12,now+i*.14+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.14+.42);o.connect(g).connect(a.destination);o.start(now+i*.14);o.stop(now+i*.14+.43)});setTimeout(()=>a.close(),1300)}catch(e){}}
function fire(action){lastFire=performance.now();events++;const line=texts[action][+$('level').value];$('subtitle').textContent=line;$('subtitle').classList.add('visible');$('tag').textContent='🎭 已识别：'+names[action];$('overlay').className='overlay '+(action==='forehead'?'gray':action==='head'?'flash':'warm');stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');sound();if(navigator.vibrate)navigator.vibrate(100);const li=document.createElement('li');li.textContent=`${new Date().toLocaleTimeString()} · ${names[action]} · ${levels[+$('level').value]}：${line}`;if(events===1)$('history').innerHTML='';$('history').prepend(li);status('识别成功：'+names[action]);clearTimeout(clearTimer);clearTimer=setTimeout(()=>{$('subtitle').classList.remove('visible');$('overlay').className='overlay';stage.classList.remove('shake')},2600)}
async function setup(){const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');const base='https://storage.googleapis.com/mediapipe-models/';pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:base+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.6,minPosePresenceConfidence:.6,minTrackingConfidence:.6});face=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:base+'face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.6,minFacePresenceConfidence:.6,minTrackingConfidence:.6});}
async function start(){try{$('start').disabled=true;status('正在请求摄像头权限……');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();$('placeholder').style.display='none';status('正在加载 AI 模型（首次需联网）……');if(!pose)await setup();running=true;lastVideoTime=-1;stable='';stableFrames=0;armed=true;lastAction='';$('stop').disabled=false;$('tag').textContent='🟢 正在识别';status('识别中 · 请面向镜头做动作');loop()}catch(e){status('启动失败：'+(e?.message||e));stop()}}
function loop(){if(!running)return;try{if(video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;const w=video.videoWidth,h=video.videoHeight;canvas.width=w;canvas.height=h;const t=performance.now(),pr=pose.detectForVideo(video,t),fr=face.detectForVideo(video,t);ctx.clearRect(0,0,w,h);const p=pr.landmarks?.[0],f=fr.faceLandmarks; if(p){ctx.fillStyle='#c6a4ff';for(const point of p){if(point.visibility>.55){ctx.beginPath();ctx.arc(point.x*w,point.y*h,3,0,Math.PI*2);ctx.fill()}}}const a=detect(p,f);if(a===stable)stableFrames++;else{stable=a;stableFrames=1}if(!a){if(stableFrames>=5)armed=true}else if(stableFrames>=4&&armed&&t-lastFire>1600){fire(a);armed=false;lastAction=a}if(!a&&t-lastFire>2800)$('tag').textContent='🟢 正在识别';}}
}catch(e){status('识别异常：'+e.message);stop();return}raf=requestAnimationFrame(loop)}
function stop(){running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);$('placeholder').style.display='block';$('start').disabled=false;$('stop').disabled=true;$('tag').textContent='等待摄像头';$('subtitle').classList.remove('visible');$('overlay').className='overlay';if(!$('status').textContent.startsWith('启动失败')&&!$('status').textContent.startsWith('识别异常'))status('已结束 · 可再次开始表演')}
$('start').onclick=start;$('stop').onclick=stop;window.addEventListener('pagehide',stop);
</script></body></html>
