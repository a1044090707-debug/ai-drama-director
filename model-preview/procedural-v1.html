<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小橙 · 3D 造型工作室</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#344333;background:#f6f5ee;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,a,input{touch-action:manipulation}button{font:inherit;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:22px 32px;border-bottom:1px solid #dfe4d7;background:#fbfbf5}.brand{display:flex;gap:12px;align-items:center}.mark{background:#e8efdc;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;color:#698050;font-size:23px}.brand strong{font-size:18px}.brand small{display:block;color:#929c88;font-size:11px;letter-spacing:2px;margin-top:4px}.badge{color:#798773;font-size:12px;background:#eef1e7;padding:8px 13px;border-radius:99px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;max-width:1560px;margin:auto;padding:24px 28px}.stage{position:relative;border:1px solid #e0e5d6;border-radius:26px;overflow:hidden;min-height:710px;height:calc(100vh - 145px);background:radial-gradient(ellipse at 42% 30%,#fffdf5 0,#edf0e1 66%,#dce5ce 100%)}#viewport{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.stage-label{position:absolute;top:25px;left:26px;pointer-events:none}.stage-label span{color:#879575;font-size:10px;letter-spacing:3px}.stage-label h1{font-size:28px;margin:9px 0 5px;letter-spacing:1px}.stage-label p{font-size:12px;color:#929b86;margin:0}.viewbar{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border:1px solid #ffffffd9;border-radius:15px;background:#fffdf2d9;backdrop-filter:blur(12px);white-space:nowrap}.viewbar button{border:0;background:transparent;color:#7c8971;padding:9px 14px;border-radius:9px;font-size:12px}.viewbar button.active{background:#6d8455;color:white}.drag-tip{position:absolute;bottom:20px;text-align:center;width:100%;color:#8d9782;font-size:11px;pointer-events:none}#status{position:absolute;top:27px;right:23px;color:#8b977e;font:10px monospace;text-align:right;line-height:1.8}.side{display:flex;flex-direction:column;gap:15px}.panel{border:1px solid #e0e5d7;background:#fffef8;border-radius:19px;padding:20px}.panel h2{font-size:14px;margin:0 0 18px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin:18px 0 8px}.row output{color:#ce7d30;font-variant-numeric:tabular-nums}.range{width:100%;accent-color:#799260;cursor:pointer;height:16px}.small{font-size:11px;color:#8b9580;line-height:1.8;margin:10px 0 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button,.download{display:block;border:1px solid #dce3d2;background:#f1f4e9;color:#5b7148;border-radius:9px;padding:11px;font-size:12px;text-align:center;text-decoration:none}.buttons button[aria-pressed=true]{background:#6d8455;color:white}.buttons .reset{background:#fffaf0;color:#b27e45;border-color:#efdfc5}.reference{display:block;background:#f5efdf;border-radius:11px;overflow:hidden}.reference img{display:block;width:100%;height:135px;object-fit:cover;object-position:center 34%}.ref-caption{margin:10px 0 0;font-size:11px;color:#8b9580}.download{background:#ed8c36;border-color:#ed8c36;color:white;margin-top:14px}.toggle{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:12px;color:#7e8b72}.toggle input{accent-color:#6d8455}.error{position:absolute;left:10%;top:45%;width:80%;color:#b54c38;background:#fff6ed;padding:25px;border-radius:15px;line-height:1.8}.footer{font-size:10px;color:#96a08b;line-height:1.9;padding:0 5px 15px}@media(max-width:950px){.layout{grid-template-columns:minmax(0,1fr) 285px;padding:18px;gap:16px}.stage{min-height:650px}.panel{padding:16px}.stage-label h1{font-size:23px}header{padding:16px 20px}.viewbar button{padding:9px}}@media(max-width:700px){header{padding:14px 16px}.badge{font-size:10px}.brand strong{font-size:15px}.layout{display:block;padding:12px}.stage{height:68vh;min-height:490px}.side{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{min-width:0}.panel.reference-panel{grid-column:1/-1}.reference img{height:auto;max-height:220px;object-fit:contain}.footer{grid-column:1/-1}.stage-label{left:18px;top:19px}.stage-label h1{font-size:21px}#status{top:21px;right:15px}.viewbar{bottom:45px}.viewbar button{padding:8px 11px}.panel h2{font-size:13px}.row{font-size:11px}.buttons{grid-template-columns:1fr}.buttons button{padding:9px}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark">◒</div><div><strong>角色造型工作室</strong><small>CHARACTER STUDY / 01</small></div></div><span class="badge">独立模型预览 · 小橙</span></header>
  <main class="layout">
    <section class="stage" aria-label="橙帽女生三维模型预览">
      <div id="viewport"></div><div class="stage-label"><span>ORANGE CAP GIRL</span><h1>橙帽女生 · 小橙</h1><p>栗棕卷发 / 橙色棒球帽 / 奶油绿卫衣</p></div>
      <div id="status" role="status">正在构建模型…</div>
      <nav class="viewbar" aria-label="模型视角"><button data-view="0" class="active">正面</button><button data-view="-35">左转</button><button data-view="35">右转</button><button data-view="90">侧面</button><button data-view="180">背面</button></nav>
      <div class="drag-tip">拖动画面旋转 · 滚轮或双指缩放</div>
    </section>
    <aside class="side">
      <section class="panel"><h2>01 / 观察造型</h2>
        <label class="row" for="yaw">左右转头 <output id="yawValue">0°</output></label><input class="range" id="yaw" type="range" min="-180" max="180" value="0">
        <label class="row" for="pitch">抬头 / 低头 <output id="pitchValue">0°</output></label><input class="range" id="pitch" type="range" min="-35" max="35" value="0">
        <div class="buttons" style="margin-top:18px"><button id="spin" aria-pressed="false">自动环绕</button><button id="reset" class="reset">重置视角</button></div>
        <label class="toggle"><input id="wireframe" type="checkbox"> 查看网格</label><label class="toggle"><input id="showHair" type="checkbox" checked> 显示卷发</label>
      </section>
      <section class="panel"><h2>02 / 测试表情</h2>
        <label class="row" for="blink">闭眼 <output id="blinkValue">0%</output></label><input class="range" id="blink" type="range" min="0" max="100" value="0">
        <label class="row" for="jaw">张嘴 <output id="jawValue">0%</output></label><input class="range" id="jaw" type="range" min="0" max="100" value="0">
        <label class="row" for="smile">微笑 <output id="smileValue">25%</output></label><input class="range" id="smile" type="range" min="0" max="100" value="25">
        <label class="toggle"><input id="autoBlink" type="checkbox" checked> 自然眨眼</label>
      </section>
      <section class="panel reference-panel"><h2>03 / 对照设计</h2><a class="reference" href="../design-demos/orange-girl-modeling-v1/01-head-turnaround.png" target="_blank"><img src="../design-demos/orange-girl-modeling-v1/01-head-turnaround.png" alt="已确认的头部三视图，点击查看原图"></a><p class="ref-caption">点击打开三视图，比较脸型、帽子和卷发。</p><button class="download" id="export">下载当前模型 GLB</button><a id="glbDownload" download="orange-girl-head-study.glb" hidden>下载模型文件</a><p class="small">导出当前姿态的静态网格与材质。网页中的表情由程序驱动，导出文件暂不含骨骼或表情动画。</p></section>
      <div class="footer">建模预览 v1 · 真实三维网格<br>本页独立运行，未接入成品摄像头页面。</div>
    </aside>
  </main>
  <script type="module" src="./viewer.js"></script>
</body></html>
