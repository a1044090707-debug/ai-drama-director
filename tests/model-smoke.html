<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MediaPipe 多人模型检查</title>
<style>body{font:16px/1.8 system-ui;padding:24px}pre{white-space:pre-wrap}</style>
<h1>MediaPipe 多人模型检查</h1><p>不申请摄像头。加载正式模型，在空白画布执行一次推理。</p><pre id="result">正在检查…</pre>
<script type="module">
const out=document.getElementById('result'),results=[];const log=s=>{results.push(s);out.textContent=results.join('\n');};
try{
  const root='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
  const {FaceLandmarker,PoseLandmarker,FilesetResolver}=await import(root+'/vision_bundle.mjs');
  log('运行库导入成功');const vision=await FilesetResolver.forVisionTasks(root+'/wasm');
  const base='https://storage.googleapis.com/mediapipe-models/';
  const canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;canvas.getContext('2d').fillRect(0,0,640,480);
  for(const [Class,path,config,key] of [[FaceLandmarker,'face_landmarker/face_landmarker/float16/1/face_landmarker.task',{numFaces:8,outputFacialTransformationMatrixes:true,outputFaceBlendshapes:true},'faceLandmarks'],[PoseLandmarker,'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',{numPoses:4},'landmarks']]){
    const model=await Class.createFromOptions(vision,{baseOptions:{modelAssetPath:base+path,delegate:'CPU'},runningMode:'VIDEO',...config});
    const result=model.detectForVideo(canvas,performance.now());log(JSON.stringify(config)+' 初始化和 VIDEO 推理成功，空白帧检测数 '+result[key].length);model.close();
  }
  log('PASS');
}catch(e){log('FAIL '+e.name+': '+e.message);}
</script></html>
